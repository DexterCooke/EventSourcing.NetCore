name: push-bool-quick-check
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Create tiny Dockerfile
        run: printf 'FROM alpine:3.19\nCMD ["true"]\n' > Dockerfile
      - name: Build with boolean push (no creds needed)
        uses: docker/build-push-action@v2
        with:
          context: .
          tags: noop/test:latest
          push: ${{ github.ref == 'refs/heads/main' }}
