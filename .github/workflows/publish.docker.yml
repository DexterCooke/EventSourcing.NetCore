# .github/workflows/publish.docker.yml
name: Publish Docker

on:
  - push
  - workflow_dispatch   # lets you run it manually from Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      # Only log in on main AND when secrets exist (skips on your branch/fork)
      - name: Login to DockerHub
        if: ${{ github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          # must be a boolean expression, not a plain string
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: oskardudycz/eventsourcing.netcore:latest

      - name: Image digest
        if: ${{ steps.docker_build.outputs.digest != '' }}
        run: echo ${{ steps.docker_build.outputs.digest }}
